[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarkas"
version = "1.1.0"
description = "Sarkas - A fast pure-python Molecular Dynamics suite for plasmas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Murillo Group", email = "sarkasdev@gmail.com"}
]
maintainers = [
    {name = "Murillo Group", email = "sarkasdev@gmail.com"}
]
keywords = ["molecular dynamics", "plasma", "simulation", "physics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core scientific stack
    "numpy",
    "scipy",
    "pandas",
    "numba>=0.50",
    "astropy",

    # FFT
    "pyfftw>=0.12.0",

    # I/O
    "h5py",
    "pyyaml",
    "tables",
    "tqdm",
    "pyfiglet",
    "zarr>=2.16",
    "numcodecs>=0.12",
    "xarray>=2023.1",

    # Notebooks
    "ipython",
    "jupyter",
    "jupyterlab",
    "notebook",

    # Visualization
    "matplotlib>=3.5",
    "seaborn",
    "plotly>=5.0",

    # Analysis
    "arch",
    "pymannkendall",
    "fmm3dpy",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tox>=4.0",
]
dev = [
    "black",
    "isort",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx==4.5.0",
    "sphinx-book-theme==0.3.2",
    "sphinx-design==0.4.1",
    "sphinxcontrib-bibtex==2.4.2",
    "sphinx-autodoc-typehints==1.18.3",
    "recommonmark==0.7.1",
    "sphinx-copybutton==0.5.0",
    "nbsphinx==0.9.3",
    "sphinxext-opengraph==0.6.3",
]

[project.urls]
Homepage = "https://murillogroup.github.io/sarkas"
Documentation = "https://murillogroup.github.io/sarkas"
Repository = "https://github.com/murillo-group/sarkas"
"Bug Tracker" = "https://github.com/murillo-group/sarkas/issues"

[tool.setuptools]
packages = ["sarkas"]
zip-safe = false

[tool.setuptools.package-data]
"sarkas.plotting" = ["*.mplstyle"]

[tool.black]
line-length = 122
exclude = '''
/(
  | \.git
  | \.github
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
sections = ["FUTURE", "STDLIB", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["sarkas"]
default_section = "STDLIB"
force_alphabetical_sort_within_sections = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=sarkas --cov-report=term-missing"

[tool.coverage.run]
source = ["sarkas"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.towncrier]
package = "sarkas"
filename = "CHANGELOG.rst"
directory = "changelog/"

[tool.deptry]
ignore_transitive = ["sarkas"]