# setup.cfg - Kept for backward compatibility
# Main configuration is now in pyproject.toml

[metadata]
name = sarkas
version = 1.1.0
description = Sarkas - A fast pure-python Molecular Dynamics suite for plasmas
long_description = file: README.md
long_description_content_type = text/markdown
author = Murillo Group
author_email = sarkasdev@gmail.com
license = MIT
license_files = LICENSE
url = https://murillogroup.github.io/sarkas
project_urls =
    Documentation = https://murillogroup.github.io/sarkas
    Source = https://github.com/murillo-group/sarkas
    Bug Tracker = https://github.com/murillo-group/sarkas/issues

classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Physics

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy
    scipy
    pandas
    numba>=0.50
    pyfftw
    pyyaml
    tables
    tqdm
    pyfiglet==0.8.post1
    jupyter
    jupyterlab
    notebook
    matplotlib>=3.5
    seaborn
    plotly>=5.0
    fmm3dpy

[options.packages.find]
exclude =
    tests*
    docs*

[options.package_data]
sarkas.plotting = *.mplstyle

[options.extras_require]
testing =
    pytest>=7.0
    pytest-cov>=4.0
    tox>=4.0
dev =
    black
    isort
    pytest>=7.0
    pytest-cov>=4.0

[flake8]
max-line-length = 122
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info

[bdist_wheel]
universal = 0