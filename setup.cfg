# setup.cfg - Kept for backward compatibility
# Main configuration is now in pyproject.toml

[metadata]
name = sarkas
version = 1.1.0
description = Sarkas - A fast pure-python Molecular Dynamics suite for plasmas
long_description = file: README.md
long_description_content_type = text/markdown
author = Murillo Group
author_email = sarkasdev@gmail.com
license = MIT
license_files = LICENSE
url = https://murillogroup.github.io/sarkas
project_urls =
    Documentation = https://murillogroup.github.io/sarkas
    Source = https://github.com/murillo-group/sarkas
    Bug Tracker = https://github.com/murillo-group/sarkas/issues

classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Physics

[options]
packages = find:
python_requires = >=3.9
install_requires =
    # Core scientific stack
    numpy
    scipy
    pandas
    numba>=0.50

    # FFT
    pyfftw>=0.12.0

    # I/O
    h5py
    pyyaml
    tables
    tqdm
    pyfiglet==0.8.post1
    zarr
    xarray

    # Notebooks
    jupyter
    jupyterlab
    notebook

    # Visualization
    matplotlib>=3.5
    seaborn
    plotly>=5.0

    # Analysis
    arch
    fmm3dpy

[options.packages.find]
exclude =
    tests*
    docs*

[options.package_data]
sarkas.plotting = *.mplstyle

[options.extras_require]
testing =
    pytest>=7.0
    pytest-cov>=4.0
    tox>=4.0
dev =
    black
    isort
    pytest>=7.0
    pytest-cov>=4.0
docs =
    sphinx==4.5.0
    sphinx-book-theme==0.3.2
    sphinx-design==0.4.1
    sphinxcontrib-bibtex==2.4.2
    sphinx-autodoc-typehints==1.18.3
    recommonmark==0.7.1
    sphinx-copybutton==0.5.0
    nbsphinx==0.9.3
    sphinxext-opengraph==0.6.3

[flake8]
max-line-length = 122
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info

[bdist_wheel]
universal = 0