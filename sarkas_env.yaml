name: sarkas

channels:
  - conda-forge

dependencies:
  - python=3.9
  - pip

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - numba>=0.50
  - astropy

  # FFT
  - pyfftw>=0.12.0

  # I/O
  - h5py
  - pyyaml
  - pytables
  - tqdm
  - pyfiglet
  - zarr
  - xarray

  # Notebooks
  - ipython
  - jupyter
  - jupyterlab
  - notebook

  # Visualization
  - matplotlib>=3.5
  - seaborn
  - plotly>=5.0

  # Analysis
  - pymannkendall

  # Testing
  - pytest
  - pytest-cov

  # Documentation
  - sphinx=4.5.0
  - sphinx-book-theme=0.3.2
  - sphinx-design=0.4.1
  - sphinxcontrib-bibtex=2.4.2
  - sphinx-autodoc-typehints=1.18.3
  - recommonmark=0.7.1
  - sphinx-copybutton=0.5.0

  # Development tools
  - pre-commit
  - isort
  - black
  - pipreqs
  - deptry
  - pytest
  - pytest-cov

  - pip:
      - nbsphinx==0.9.3
      - sphinxext-opengraph==0.6.3
      - arch
      - fmm3dpy
