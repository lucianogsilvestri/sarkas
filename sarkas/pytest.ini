[tool:pytest]
# Pytest configuration for sarkas thermodynamics tests

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    physics: marks tests that validate physics equations
    performance: marks tests that benchmark performance
    edge_case: marks tests for edge cases and error conditions

# Test discovery
testpaths = sarkas/physics/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Warning filters
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:sarkas.*
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:numpy.*
    
# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds) for slow tests
timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=sarkas.physics.thermodynamics --cov-report=html --cov-report=term-missing
