# keywords: Carbon-Oxygen Mixture, Yukawa, P3M, mks, random_no_reject
Particles:
    - Species:
        name: C
        number_density: 1.0e+30       # /m^3
        # mass: 1.9926467e-26            # /kg
        num: 200_000                    # total number of particles of ion1
        Z: 6.0                        # degree of ionization
        atomic_weight: 12.011                      # atomic mass
        temperature: 1.02e+5

    - Species:
        name: O
        number_density: 1.0e+30       # /m^3
        # mass: 2.6561982e-26         # /kg
        num: 200_000
        Z: 8.0                      # degree of ionization
        atomic_weight: 16                   # atomic mass
        temperature: 1.02e+5

Potential:
    type: Yukawa                 # potential type
    method: pppm                    # Linked-cell
    rc: 2.892836e-10 # 3.045082e-10          # cut-off radius, meter
    electron_temperature_eV: 1000.0
    pppm_mesh: [128, 128, 128]
    pppm_aliases: [3,3,3]
    pppm_cao: 6
    pppm_alpha_ewald: 1.311405e+10 # 8.733225e+09
    pppm_fftw_threads: 8

Integrator:
    type: Verlet                  # velocity integrator type
    dt: 1.074182e-17            # sec
    equilibration_steps: 10000
    production_steps: 30000
    eq_dump_step: 5
    prod_dump_step: 5
    thermostat_type: Berendsen               # thermostat type
    berendsen_tau: 73
    relaxation_timestep: 300

Parameters:
    units: mks                    # units
    load_method: random_no_reject
    boundary_conditions: periodic

IO:
    verbose: yes
    md_simulations_dir: SarkasSimulations
    job_dir: CO_mks_pppm                         # dir name to save data.
    job_id: CO_mks_pppm

Observables:
  - Thermodynamics:
      phase: production

  - RadialDistributionFunction:
      no_bins: 250

  - StaticStructureFactor:
      max_k_harmonics: 10
