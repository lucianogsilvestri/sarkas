# keywords: OCP, P3M, cgs, random_no_reject
Particles:
    - Species:
        name: H
        number_density: 1.62e+24       # /cm^3
        mass: 1.673e-24                # g, ptcl mass of ion1
        num: 1000                    # total number of particles of ion1
        Z: 1.0                        # degree of ionization
        temperature: 3.2636325e+03

Potential:
    type: Coulomb                 # potential type
    method: pppm                    # Linked-cell
    rc: 3.411928e-08          # cut-off radius, meter
    pppm_mesh: [32, 32, 32]
    pppm_aliases: [2, 2, 2]
    pppm_cao: 6
    pppm_alpha_ewald: 1.041271e+08

Integrator:
    type: Verlet                  # velocity integrator type
    dt: 1.193536e-17            # sec
    thermostat_type: Berendsen               # thermostat type
    thermalization_timestep: 650
    berendsen_tau: 136

Parameters:
    rand_seed: 3576516958
    units: cgs
    boundary_conditions: periodic
    load_method: production_restart
    restart_step: 50_000
    qmc_sequence: halton
    equilibration_steps: 5_000                      # number of timesteps for the equilibrium
    eq_dump_step: 10
    production_steps: 250_000
    prod_dump_step: 2          # sec
    # (OPTIONAL) This is a list of observable that you want to calculate during the simulation.
    observables_list: ["Pressure Tensor"]
    # (OPTIONAL) The observables_arrays_list is a list of Particles arrays that will be saved during the simulation
    observables_arrays_list: ["species_pressure_tensor", "dipole_moment"]  
    # This is a list of thermodynamics that you want to calculate during the simulation.
    thermodynamics_list: ["total_energy", "temperature", "kinetic_energy", "potential_energy", "pressure", "enthalpy", "dipole_moment_energy"]

IO:
    verbose: True
    job_dir: OCP_cgs        # dir name to save data. The default is "Checkpoint"

Observables:
  - RadialDistributionFunction:
      no_bins: 500

  - Thermodynamics:
      phase: production

  - DynamicStructureFactor:
      max_k_harmonics: 5

  - StaticStructureFactor:
      max_k_harmonics: 5

  - CurrentCorrelationFunction:
      max_k_harmonics: 5
